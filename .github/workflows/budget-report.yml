name: Transfer budget report

# Adds a pull request comment that compares the transfer budget reports of the pull request with
# the reports of the last green `main` CI run. The desktop test jobs in ci.yml write and upload the
# reports; the budget tests fail CI on their own. This workflow runs the `main` version of this
# file and of `scripts/transfer-budget-report.ts`. It never installs or runs pull request code: it
# reads the pull request reports only as JSON data.
#
# GitHub runs a `workflow_run` workflow only from the default branch, so a change to this file
# takes effect after it merges.
on:
  workflow_run:
    workflows: [CI]
    types: [completed]

permissions: {}

jobs:
  # A CI run of an older commit, or of a closed pull request, adds no comment: the newer run adds
  # its own. This job has no concurrency group, so a run that adds no comment cannot cancel the
  # comment of a valid run.
  source:
    name: Find the pull request reports
    if: >-
      github.event.workflow_run.event == 'pull_request' &&
      github.event.workflow_run.head_repository.full_name == github.repository &&
      github.event.workflow_run.conclusion != 'cancelled'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      actions: read
      pull-requests: read
    outputs:
      pr_number: ${{ steps.source.outputs.pr_number }}
      main_run: ${{ steps.source.outputs.main_run }}
    env:
      GH_TOKEN: ${{ github.token }}
      HEAD_SHA: ${{ github.event.workflow_run.head_sha }}
      RUN_ID: ${{ github.event.workflow_run.id }}
    steps:
      - name: Find the pull request and its reports
        id: source
        shell: bash
        run: |
          pr_number="$(jq -r '.workflow_run.pull_requests[0].number // empty' "$GITHUB_EVENT_PATH")"
          if [[ ! "$pr_number" =~ ^[0-9]+$ ]]; then
            echo "The CI run names no pull request."
            exit 0
          fi
          pr_fields="$(gh api "repos/${GITHUB_REPOSITORY}/pulls/${pr_number}" \
            --jq '[.state, .head.sha, .head.repo.full_name] | @tsv')"
          read -r state head_sha head_repository <<< "$pr_fields"
          if [[ "$state" != "open" || "$head_sha" != "$HEAD_SHA" || "$head_repository" != "$GITHUB_REPOSITORY" ]]; then
            echo "Pull request #${pr_number} is closed or has a newer commit."
            exit 0
          fi
          artifact_count="$(gh api "repos/${GITHUB_REPOSITORY}/actions/runs/${RUN_ID}/artifacts" \
            --jq '[.artifacts[] | select((.name | startswith("transfer-budget-")) and (.expired | not))] | length')"
          if [[ "$artifact_count" == "0" ]]; then
            echo "CI run ${RUN_ID} has no transfer budget report."
            exit 0
          fi
          main_run="$(gh run list -R "$GITHUB_REPOSITORY" --workflow ci.yml --branch main --event push \
            --status success --limit 1 --json databaseId --jq '.[0].databaseId // empty')"
          echo "pr_number=$pr_number" >> "$GITHUB_OUTPUT"
          echo "main_run=$main_run" >> "$GITHUB_OUTPUT"

  comment:
    name: Compare transfer budgets with main
    needs: source
    if: needs.source.outputs.pr_number
    runs-on: ubuntu-latest
    timeout-minutes: 10
    concurrency:
      group: budget-report-pr-${{ needs.source.outputs.pr_number }}
      cancel-in-progress: true
    permissions:
      actions: read
      contents: read
      pull-requests: write
    env:
      HEAD_SHA: ${{ github.event.workflow_run.head_sha }}
      MAIN_RUN: ${{ needs.source.outputs.main_run }}
      PR_NUMBER: ${{ needs.source.outputs.pr_number }}
      RUN_ID: ${{ github.event.workflow_run.id }}
    steps:
      - name: Check out main
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Bun
        uses: ./.github/actions/setup-bun
        with:
          install: ignore-scripts

      # A main run from before the reports existed, or with expired artifacts, leaves the main
      # column empty.
      - name: Download the reports
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh run download "$RUN_ID" -R "$GITHUB_REPOSITORY" --pattern 'transfer-budget-*' --dir "$RUNNER_TEMP/budget-pr"
          if [[ -n "$MAIN_RUN" ]]; then
            gh run download "$MAIN_RUN" -R "$GITHUB_REPOSITORY" --pattern 'transfer-budget-*' \
              --dir "$RUNNER_TEMP/budget-main" || echo "Main CI run ${MAIN_RUN} has no transfer budget report."
          fi

      - name: Write the comparison
        run: bun scripts/transfer-budget-report.ts "$RUNNER_TEMP/budget-pr" "$RUNNER_TEMP/budget-main" > "$RUNNER_TEMP/budget-table.md"

      - name: Add budget comment
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          marker='<!-- openbot-transfer-budget -->'
          main_source="${MAIN_RUN:+CI run ${MAIN_RUN}}"
          body="$(printf '%s\n## Transfer budget\n\n%s\n\nCompared with the last green main CI run (%s). Updated for commit `%s`.\n' \
            "$marker" "$(cat "$RUNNER_TEMP/budget-table.md")" "${main_source:-none found}" "$HEAD_SHA")"
          # Search every page, and only comments of this workflow's bot: a user comment can hold
          # the marker too.
          comment_id="$(gh api --paginate "repos/${GITHUB_REPOSITORY}/issues/${PR_NUMBER}/comments?per_page=100" \
            --jq '.[] | select(.user.login == "github-actions[bot]" and (.body | contains("<!-- openbot-transfer-budget -->"))) | .id' \
            | sed -n 1p)"
          if [[ -n "$comment_id" ]]; then
            gh api --method PATCH "repos/${GITHUB_REPOSITORY}/issues/comments/${comment_id}" -f body="$body" >/dev/null
          else
            gh api --method POST "repos/${GITHUB_REPOSITORY}/issues/${PR_NUMBER}/comments" -f body="$body" >/dev/null
          fi
