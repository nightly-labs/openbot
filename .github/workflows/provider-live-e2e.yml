name: Provider live E2E

# One real turn on Codex, Claude, Gemini and OpenCode, each in its own desktop app, at the same time
# (`bun run test:provider-live`, docs/provider-live-e2e.md). The job runs on the Mac mini runner: each
# provider uses the sign-in of the runner's user, so the job has no provider secret. It runs only
# by hand, never for a pull request: a pull request must not run its code on a computer that holds
# provider sign-ins.
on:
  # TEMPORARY: remove before merge. It lets the branch run on the Mac mini before the merge.
  push:
    branches:
      - t3/provider-e2e-ci
  workflow_dispatch:
    inputs:
      provider:
        description: The provider to test. Gemini is `antigravity`.
        type: choice
        default: all
        options:
          - all
          - codex
          - claude
          - antigravity
          - opencode

permissions: {}

# Each run uses the same app profiles in the runner's workspace.
concurrency:
  group: provider-live-e2e
  cancel-in-progress: false

jobs:
  providers:
    name: Real provider turns
    if: github.repository == 'nightly-labs/openbot'
    runs-on: [self-hosted, macOS]
    timeout-minutes: 30
    permissions:
      contents: read
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Bun
        uses: ./.github/actions/setup-bun

      - name: Run the live provider test
        env:
          PROVIDER: ${{ inputs.provider }}
        run: |
          if [ -n "$PROVIDER" ] && [ "$PROVIDER" != "all" ]; then
            bun run test:provider-live --target="$PROVIDER"
          else
            bun run test:provider-live
          fi

      - name: Show the result of each provider
        if: ${{ !cancelled() }}
        run: |
          if [ -f scripts/provider-live/.e2e/summary.md ]; then
            cat scripts/provider-live/.e2e/summary.md >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Upload the report
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: provider-live-e2e
          path: scripts/provider-live/.e2e/
          include-hidden-files: true
          if-no-files-found: ignore
          retention-days: 7
