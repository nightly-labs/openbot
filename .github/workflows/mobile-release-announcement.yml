name: Announce mobile release on Discord

# One post for each store, when users of that store can see the version. Android and iOS review a
# build on their own, often days apart. The source is apps/mobile/CHANGELOG.md:
# `bun run mobile:release` writes each store's date in the version heading. The gate is production:
# the account Worker must list the version in /v1/mobile/changelog and give its flags in
# /v1/mobile/features. The Worker deploys in the last job of CI, and a newer push to main cancels an
# older CI run, so this workflow does not follow one run. Each run compares the live state with the
# `mobile-announced/v<version>/<store>` tags and posts what has no tag. A cancelled or skipped run
# loses nothing: the next deploy, or the schedule, posts it. The desktop release has its own post in
# `release.yml`. See apps/mobile/README.md#discord-announcement.
on:
  workflow_run:
    workflows: [CI]
    types: [completed]
    branches: [main]
  # A fallback for a deploy that does not end a CI run, such as a manual Worker deploy.
  schedule:
    - cron: "17,47 * * * *"
  workflow_dispatch:
    inputs:
      version:
        description: Mobile version to post, such as 1.4.7. Empty posts what is due.
        type: string
        required: false
      stores:
        description: The stores of the post, when a version is given.
        type: choice
        options: [ios, android, both]
        default: ios
      again:
        description: Post again, even when the version has a tag.
        type: boolean
        default: false

permissions: {}

concurrency:
  group: mobile-release-announcement
  cancel-in-progress: false

jobs:
  # No environment, so the schedule runs make no deployment records.
  detect:
    name: Find the posts that are due
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
    outputs:
      due: ${{ steps.plan.outputs.due }}
    steps:
      - name: Check out main
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: main
          persist-credentials: false

      - name: Set up Bun
        uses: ./.github/actions/setup-bun
        with:
          install: none

      - name: Compare production with the post tags
        id: plan
        env:
          GH_TOKEN: ${{ github.token }}
          DISPATCHED_VERSION: ${{ inputs.version }}
        run: |
          if [[ -n "$DISPATCHED_VERSION" ]]; then
            echo "due=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          bun scripts/discord-mobile-release-announcement.ts plan

  # A failed post removes its tag, so the next run tries again. Re-run this job, or wait for the schedule.
  announce:
    name: Post on Discord
    needs: detect
    if: needs.detect.outputs.due == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    environment: release-mobile
    permissions:
      # The post tags.
      contents: write
    steps:
      - name: Check out main
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: main
          persist-credentials: false

      - name: Set up Bun
        uses: ./.github/actions/setup-bun
        with:
          install: none

      - name: Post the announcements
        env:
          GH_TOKEN: ${{ github.token }}
          DISCORD_MOBILE_RELEASE_WEBHOOK_URL: ${{ secrets.DISCORD_MOBILE_RELEASE_WEBHOOK_URL }}
          DISCORD_MOBILE_RELEASE_ROLE_ID: ${{ vars.DISCORD_MOBILE_RELEASE_ROLE_ID }}
          DISPATCHED_VERSION: ${{ inputs.version }}
          DISPATCHED_STORES: ${{ inputs.stores }}
          DISPATCHED_AGAIN: ${{ inputs.again }}
        run: |
          if [[ -n "$DISPATCHED_VERSION" ]]; then
            again=()
            [[ "$DISPATCHED_AGAIN" == "true" ]] && again=(--again)
            bun scripts/discord-mobile-release-announcement.ts announce --version "$DISPATCHED_VERSION" --stores "$DISPATCHED_STORES" "${again[@]}"
          else
            bun scripts/discord-mobile-release-announcement.ts announce
          fi
