name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  GIT_CONFIG_COUNT: 1
  GIT_CONFIG_KEY_0: init.defaultBranch
  GIT_CONFIG_VALUE_0: main

jobs:
  changes:
    # Every run starts by asking which areas the diff touches, so jobs that
    # cannot be affected never reserve a runner. `scripts/ci-affected-areas.ts`
    # holds the map and derives package edges from the workspace manifests;
    # its test keeps the map in step with the repository.
    #
    # The checkout is sparse, blobless and two commits deep: the script needs
    # only the manifests and itself, and `git diff --name-only` compares trees,
    # never file contents. On a pull request `HEAD` is GitHub's merge commit,
    # whose first parent is the base tip, so the diff needs no merge-base.
    #
    # The diff is fail-open: when it cannot be computed or mapped, every flag
    # goes true and the run costs what a full run costs, never less coverage.
    name: Detect changes
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      desktop: ${{ steps.flags.outputs.desktop }}
      mobile: ${{ steps.flags.outputs.mobile }}
      api: ${{ steps.flags.outputs.api }}
      sites: ${{ steps.flags.outputs.sites }}
      remote: ${{ steps.flags.outputs.remote }}
      storybook: ${{ steps.flags.outputs.storybook }}
      unit: ${{ steps.flags.outputs.unit }}
      code: ${{ steps.flags.outputs.code }}
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 2
          filter: blob:none
          sparse-checkout-cone-mode: false
          sparse-checkout: |
            /scripts/
            /package.json
            /apps/*/package.json
            /packages/*/package.json
            /packages/contracts/src/runtime-values.ts
            /remote/api/package.json

      # Not `./.github/actions/setup-bun`: this job needs no Node, no package
      # store and no install, and every other job waits for it.
      - name: Set up Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: 1.4.0

      - name: Flag affected areas
        id: flags
        shell: bash
        env:
          EVENT_NAME: ${{ github.event_name }}
          BEFORE_SHA: ${{ github.event.before }}
        run: |
          # `--no-renames` lists both sides of a rename, and keeps git from
          # fetching blobs to detect one.
          list_files() {
            if [[ "$EVENT_NAME" == "pull_request" ]]; then
              git diff --name-only --no-renames HEAD^1 HEAD
            elif [[ "$EVENT_NAME" == "push" ]]; then
              if [[ -z "$BEFORE_SHA" || "$BEFORE_SHA" == "0000000000000000000000000000000000000000" ]]; then
                echo "The push has no previous commit to compare against." >&2
                return 1
              fi
              git fetch --no-tags --depth=1 --filter=blob:none origin "$BEFORE_SHA" &&
                git diff --name-only --no-renames "$BEFORE_SHA" HEAD
            else
              echo "A $EVENT_NAME run has no change to compare." >&2
              return 1
            fi
          }

          if files="$(list_files)" && flags="$(printf '%s\n' "$files" | bun scripts/ci-affected-areas.ts)"; then
            printf '%s\n' "$files"
            printf '%s\n' "$flags" | tee -a "$GITHUB_OUTPUT"
            exit 0
          fi

          echo "Could not map the change; running every job." >&2
          for area in desktop mobile api sites remote storybook unit code; do
            echo "${area}=true"
          done | tee -a "$GITHUB_OUTPUT"

  lint:
    # Whole-repo Biome lint for changes outside `src/`: the `check` job lints
    # as part of `check:desktop:static`, so a desktop change would lint twice
    # if this job also ran. Mobile, API, site-router and remote sources are all
    # covered by `biome check .`, so their PRs still get lint without paying
    # for the desktop typechecks and build.
    name: Lint
    needs: [changes]
    if: needs.changes.outputs.code == 'true' && needs.changes.outputs.desktop != 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 1

      - name: Set up Bun
        uses: ./.github/actions/setup-bun
        with:
          install: ignore-scripts

      - name: Lint the repository
        run: bun run lint

  check:
    # `check:desktop` is this job and `browser` together, in that order. The
    # browser smoke test starts the real Electron binary under xvfb on another
    # Ubuntu runner, so the two run side by side. The install here is the full
    # one: this job builds with electron-vite, which resolves the `electron`
    # package.
    name: Check
    needs: [changes]
    if: needs.changes.outputs.desktop == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 1

      - name: Set up Bun
        uses: ./.github/actions/setup-bun

      - name: Check desktop application
        run: bun run check:desktop:static

  browser:
    # The smoke test starts the real Electron binary and opens windows, so it
    # needs a display. Ubuntu runners have none, so it runs under xvfb, where
    # the queue is shorter and the boot faster than a macOS runner. The install
    # is the default full one: it downloads the Electron binary the test
    # starts, which `development-checks.md` measures as faster than restoring
    # a binary cache.
    name: Browser smoke
    needs: [changes]
    if: needs.changes.outputs.desktop == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 1

      - name: Set up Bun
        uses: ./.github/actions/setup-bun

      - name: Install a virtual display if missing
        shell: bash
        run: |
          command -v xvfb-run >/dev/null || {
            sudo apt-get update
            sudo apt-get install --no-install-recommends --yes xvfb
          }

      - name: Run the browser smoke test
        run: xvfb-run -a bun run test:browser

  tests-desktop:
    # ubuntu-latest gives 4 vCPUs, so vitest runs 3 workers and the job is
    # CPU-bound. The three test suites run in parallel jobs so the short
    # site-router and remote suites no longer wait for the desktop suite.
    #
    # The desktop suite is the long pole of the three, so it is split again
    # across shards that run as their own runners. The split is by recorded
    # duration rather than vitest's own file-size one - see
    # tools/vitest/balanced-sequencer.ts for why, and run `bun run
    # test:durations` when the two shards below stop finishing together.
    #
    # Mobile sources are included: the `mobile-ui` vitest project lives in this
    # suite, so an `apps/mobile` change runs its tests here and its typecheck
    # in `surfaces`.
    name: Tests (desktop ${{ matrix.shard }}/2)
    needs: [changes]
    if: needs.changes.outputs.unit == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2]
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 1

      - name: Set up Bun
        uses: ./.github/actions/setup-bun
        with:
          install: ignore-scripts

      - name: Run desktop tests
        run: bun run test:desktop -- --shard=${{ matrix.shard }}/2

  tests-small:
    # The site-router and remote suites are each minutes of tests behind a full
    # checkout and install, so they share one runner and run concurrently
    # instead of paying that setup twice. Each suite still runs only when its
    # own area changed; the other side is skipped, not run empty.
    name: Tests (sites, remote)
    needs: [changes]
    if: needs.changes.outputs.sites == 'true' || needs.changes.outputs.remote == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 1

      - name: Set up Bun
        uses: ./.github/actions/setup-bun
        with:
          install: ignore-scripts

      - name: Run site router and remote API tests
        shell: bash
        env:
          RUN_SITES: ${{ needs.changes.outputs.sites }}
          RUN_REMOTE: ${{ needs.changes.outputs.remote }}
        run: |
          pids=()
          names=()
          if [[ "$RUN_SITES" == "true" ]]; then
            bun run test:sites & pids+=($!); names+=("sites")
          fi
          if [[ "$RUN_REMOTE" == "true" ]]; then
            bun run test:remote & pids+=($!); names+=("remote")
          fi
          status=0
          for i in "${!pids[@]}"; do
            if ! wait "${pids[$i]}"; then
              echo "The ${names[$i]} suite failed." >&2
              status=1
            fi
          done
          exit "$status"

  surfaces:
    # `desktop:typecheck` covers only the desktop projects, so without this job
    # `apps/mobile`, `apps/site-router`, `packages/team-client` and `remote/api`
    # first break at release time rather than on the pull request that broke
    # them. Mobile's typecheck generates `expo-env.d.ts` and the uniwind
    # declarations first - both are gitignored, so a fresh checkout cannot
    # resolve `global.css`. `remote/api` is typechecked through the workspace's
    # own script rather than through `remote:check`, so that the tests it also
    # runs stay in the Tests job; its `include` reaches `../scripts/*.ts`, so the
    # stack scripts come with it. `remote:check:compose` is the rest of
    # `remote:check`: `docker compose config` interpolates client-side and never
    # opens a socket, so it validates both Compose files on a runner with no
    # daemon.
    #
    # The five checks touch disjoint projects, so they run concurrently in one
    # job: one checkout and install instead of five, without waiting in line.
    name: Surfaces
    needs: [changes]
    if: needs.changes.outputs.mobile == 'true' || needs.changes.outputs.sites == 'true' || needs.changes.outputs.remote == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 1

      - name: Set up Bun
        uses: ./.github/actions/setup-bun
        with:
          install: ignore-scripts

      - name: Typecheck surfaces and validate Compose
        run: bun run --parallel mobile:typecheck typecheck:sites typecheck:team-client typecheck:remote remote:check:compose

  api:
    name: API
    needs: [changes]
    if: needs.changes.outputs.api == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 1

      - name: Set up Bun
        uses: ./.github/actions/setup-bun
        with:
          install: ignore-scripts

      - name: Check API
        run: bun run check:api

  storybook:
    name: Storybook build
    needs: [changes]
    if: needs.changes.outputs.storybook == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 1

      - name: Set up Bun
        uses: ./.github/actions/setup-bun
        with:
          install: ignore-scripts

      - name: Build Storybook
        run: bun run build-storybook
        env:
          # This output is not published. Skip Solid's per-component docgen analysis.
          OPENBOT_STORYBOOK_CHECK: "true"

  preview:
    name: Cloudflare preview
    needs: [changes]
    if: github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository && needs.changes.outputs.api == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment: cloudflare-preview
    permissions:
      contents: read
      pull-requests: write
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 1

      - name: Set up Bun
        uses: ./.github/actions/setup-bun

      - name: Build isolated preview
        run: bun run api:build
        env:
          CLOUDFLARE_ENV: preview

      - name: Upload preview version
        id: deploy-preview
        uses: cloudflare/wrangler-action@ebbaa1584979971c8614a24965b4405ff95890e0 # v4.0.0
        with:
          apiToken: ${{ secrets.CLOUDFLARE_PREVIEW_DEPLOY_TOKEN }}
          accountId: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
          workingDirectory: apps/auth-api
          packageManager: bun
          command: versions upload --config dist/server/wrangler.json --preview-alias pr-${{ github.event.pull_request.number }}

      - name: Read stable preview URL
        id: preview-url
        shell: bash
        env:
          WRANGLER_OUTPUT: ${{ steps.deploy-preview.outputs.command-output }}
        run: |
          preview_url="$(printf '%s\n' "$WRANGLER_OUTPUT" | sed -n 's/^Version Preview Alias URL: //p' | tail -n 1)"
          if [[ ! "$preview_url" =~ ^https://[a-z0-9.-]+\.workers\.dev/?$ ]]; then
            echo "Wrangler did not return a valid preview alias URL." >&2
            exit 1
          fi
          echo "url=$preview_url" >> "$GITHUB_OUTPUT"

      - name: Add preview comment
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          PREVIEW_URL: ${{ steps.preview-url.outputs.url }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: |
          marker='<!-- openbot-cloudflare-preview -->'
          body="${marker}
          ## Cloudflare preview

          [Open the landing preview](${PREVIEW_URL})

          Updated for commit \`${GITHUB_SHA}\`."
          comment_id="$(gh api "repos/${GITHUB_REPOSITORY}/issues/${PR_NUMBER}/comments?per_page=100" \
            --jq 'map(select(.body | contains("<!-- openbot-cloudflare-preview -->")))[0].id // empty')"
          if [[ -n "$comment_id" ]]; then
            gh api --method PATCH "repos/${GITHUB_REPOSITORY}/issues/comments/${comment_id}" -f body="$body" >/dev/null
          else
            gh api --method POST "repos/${GITHUB_REPOSITORY}/issues/${PR_NUMBER}/comments" -f body="$body" >/dev/null
          fi

  deploy-production:
    name: Deploy Cloudflare production
    # `surfaces` gates the deploy even though the Worker it ships lives in
    # `apps/auth-api`, which `api` already covers: mobile, the site router, the
    # team client and the remote stack all consume the account API, so a red
    # Surfaces is the signal that this deploy is the thing about to break them.
    # Every other job gates it too.
    #
    # `always()` is load-bearing. Without a status function GitHub prepends
    # `success()`, which is false when any needed job was skipped, and `lint`
    # and `check` never both run. A skipped job means the change could not
    # reach it, so only a failure or a cancellation holds the deploy back.
    if: >-
      always() &&
      github.event_name == 'push' && github.ref == 'refs/heads/main' &&
      needs.changes.result == 'success' &&
      !contains(needs.*.result, 'failure') && !contains(needs.*.result, 'cancelled')
    needs: [changes, lint, check, browser, tests-desktop, tests-small, api, storybook, surfaces]
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment: cloudflare-production
    permissions:
      contents: read
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 1

      - name: Set up Bun
        uses: ./.github/actions/setup-bun

      - name: Build production Worker
        run: bun run api:build

      - name: Apply production D1 migrations
        working-directory: apps/auth-api
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_PRODUCTION_DEPLOY_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
        run: ../../node_modules/.bin/wrangler d1 migrations apply DB --remote --config wrangler.jsonc

      - name: Deploy public site router
        working-directory: apps/site-router
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_SITE_ROUTER_DEPLOY_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
        run: ../../node_modules/.bin/wrangler deploy --config wrangler.jsonc --keep-vars

      - name: Prepare runtime secrets
        id: runtime-secrets
        shell: bash
        env:
          EMAIL_SMTP_PASSWORD: ${{ secrets.EMAIL_SMTP_PASSWORD }}
          SKILLS_ADMIN_TOKEN: ${{ secrets.SKILLS_ADMIN_TOKEN }}
          SITE_OPERATIONS_ADMIN_TOKEN: ${{ secrets.SITE_OPERATIONS_ADMIN_TOKEN }}
          SITE_REPORT_HASH_SECRET: ${{ secrets.SITE_REPORT_HASH_SECRET }}
          REMOTE_TICKET_PRIVATE_JWK: ${{ secrets.REMOTE_TICKET_PRIVATE_JWK }}
          REMOTE_TICKET_PUBLIC_JWKS: ${{ secrets.REMOTE_TICKET_PUBLIC_JWKS }}
          REMOTE_AUTH_WEBHOOK_SECRET: ${{ secrets.REMOTE_AUTH_WEBHOOK_SECRET }}
        run: |
          secrets_path="$RUNNER_TEMP/openbot-worker-secrets.json"
          umask 077
          SECRETS_PATH="$secrets_path" bun -e '
            const smtp = process.env.EMAIL_SMTP_PASSWORD;
            const skillsAdmin = process.env.SKILLS_ADMIN_TOKEN;
            const siteOperationsAdmin = process.env.SITE_OPERATIONS_ADMIN_TOKEN;
            const siteReportHash = process.env.SITE_REPORT_HASH_SECRET;
            const remotePrivateJwk = process.env.REMOTE_TICKET_PRIVATE_JWK;
            const remotePublicJwks = process.env.REMOTE_TICKET_PUBLIC_JWKS;
            const remoteWebhookSecret = process.env.REMOTE_AUTH_WEBHOOK_SECRET;
            const path = process.env.SECRETS_PATH;
            if (
              !smtp ||
              !skillsAdmin ||
              !siteReportHash ||
              !remotePrivateJwk ||
              !remotePublicJwks ||
              !remoteWebhookSecret ||
              !path
            ) {
              throw new Error("Required production secrets are missing.");
            }
            const secrets = {
              EMAIL_SMTP_PASSWORD: smtp,
              SKILLS_ADMIN_TOKEN: skillsAdmin,
              SITE_REPORT_HASH_SECRET: siteReportHash,
              ...(siteOperationsAdmin ? { SITE_OPERATIONS_ADMIN_TOKEN: siteOperationsAdmin } : {}),
              REMOTE_TICKET_PRIVATE_JWK: remotePrivateJwk,
              REMOTE_TICKET_PUBLIC_JWKS: remotePublicJwks,
              REMOTE_AUTH_WEBHOOK_SECRET: remoteWebhookSecret,
            };
            await Bun.write(path, JSON.stringify(secrets));
          '
          echo "path=$secrets_path" >> "$GITHUB_OUTPUT"

      - name: Deploy production Worker
        working-directory: apps/auth-api
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_PRODUCTION_DEPLOY_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
        run: ../../node_modules/.bin/wrangler deploy --config dist/server/wrangler.json --keep-vars --secrets-file "${{ steps.runtime-secrets.outputs.path }}"

      - name: Remove temporary runtime secrets
        if: always() && steps.runtime-secrets.outputs.path != ''
        run: rm -f "${{ steps.runtime-secrets.outputs.path }}"

      - name: Verify production deployment
        shell: bash
        env:
          SITE_HOSTING_EXPECTED_ENABLED: ${{ vars.SITE_HOSTING_EXPECTED_ENABLED }}
        run: |
          verification_dir="$(mktemp -d)"
          trap 'rm -rf "$verification_dir"' EXIT
          curl --fail --silent --show-error --retry 5 --retry-all-errors https://openbot.run/ >/dev/null
          join_status="$(curl --silent --show-error --retry 5 --retry-all-errors \
            --max-redirs 0 --dump-header "$verification_dir/join.headers" \
            --output "$verification_dir/join.html" --write-out '%{http_code}' \
            https://openbot.run/join)"
          test "$join_status" = "200"
          tr -d '\r' < "$verification_dir/join.headers" | grep -Eiq '^cache-control:.*no-store'
          tr -d '\r' < "$verification_dir/join.headers" | grep -Eiq '^referrer-policy:.*no-referrer'
          association_status="$(curl --silent --show-error --retry 5 --retry-all-errors \
            --max-redirs 0 --dump-header "$verification_dir/association.headers" \
            --output "$verification_dir/association.json" --write-out '%{http_code}' \
            https://openbot.run/.well-known/apple-app-site-association)"
          test "$association_status" = "200"
          tr -d '\r' < "$verification_dir/association.headers" | grep -Eiq '^content-type: application/json'
          jq -e '.applinks.details == [{"appID":"ZTRDTUL87R.app.openbot.desktop","paths":["/join"]}]' \
            "$verification_dir/association.json" >/dev/null
          curl --fail --silent --show-error --retry 5 --retry-all-errors https://api.openbot.run/health/live >/dev/null
          curl --fail --silent --show-error --retry 5 --retry-all-errors https://api.openbot.run/health/ready >/dev/null
          site_status="$(curl --silent --show-error --retry 5 --retry-all-errors \
            --max-redirs 0 --dump-header "$verification_dir/site-router.headers" \
            --output "$verification_dir/site-router.txt" --write-out '%{http_code}' \
            https://deployment-smoke-check.openbot.site/)"
          case "$SITE_HOSTING_EXPECTED_ENABLED" in
            true) test "$site_status" = "404" ;;
            false) test "$site_status" = "503" ;;
            *) echo "SITE_HOSTING_EXPECTED_ENABLED must be true or false." >&2; exit 1 ;;
          esac
          tr -d '\r' < "$verification_dir/site-router.headers" | grep -Eiq '^cache-control:.*no-store'
          tr -d '\r' < "$verification_dir/site-router.headers" | grep -Eiq '^x-content-type-options:.*nosniff'
          tr -d '\r' < "$verification_dir/site-router.headers" | grep -Eiq '^x-robots-tag:.*noindex'

  ci-result:
    # The one check branch protection requires. Path filtering skips jobs, and
    # renaming or merging a job would otherwise mean editing the required list
    # in repository settings. This job always runs and fails when any check
    # failed or was cancelled; a skipped check passes.
    name: CI result
    if: always()
    needs: [changes, lint, check, browser, tests-desktop, tests-small, surfaces, api, storybook]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Require every check to pass or skip
        shell: bash
        env:
          RESULTS: ${{ toJSON(needs) }}
        run: |
          failed="$(jq -r 'to_entries[] | select(.value.result == "failure" or .value.result == "cancelled") | "\(.key): \(.value.result)"' <<< "$RESULTS")"
          if [[ -n "$failed" ]]; then
            echo "$failed" >&2
            exit 1
          fi
