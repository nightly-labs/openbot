name: Release browser extension

on:
  workflow_dispatch:

permissions: {}

jobs:
  package:
    name: Build the Chrome Web Store package
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - name: Check out
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Bun and Node
        uses: ./.github/actions/setup-bun
        with:
          install: ignore-scripts

      - name: Build the extension
        run: bun run --cwd apps/browser-extension build

      - name: Zip the extension
        id: package
        shell: bash
        run: |
          version="$(jq -r .version apps/browser-extension/dist/manifest.json)"
          name="openbot-extension-${version}.zip"
          (cd apps/browser-extension/dist && zip -r -X "$RUNNER_TEMP/$name" .)
          unzip -l "$RUNNER_TEMP/$name"
          echo "path=$RUNNER_TEMP/$name" >> "$GITHUB_OUTPUT"
          echo "Upload \`$name\` (manifest version $version) in the Chrome Web Store Developer Dashboard." >> "$GITHUB_STEP_SUMMARY"

      - name: Upload the package
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          path: ${{ steps.package.outputs.path }}
          archive: false
          if-no-files-found: error
          retention-days: 30
