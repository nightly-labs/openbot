name: Release iOS to TestFlight

on:
  workflow_dispatch:

permissions: {}

concurrency:
  group: release-ios
  cancel-in-progress: false

jobs:
  release:
    name: Build iOS and upload to TestFlight
    if: github.ref == 'refs/heads/main'
    runs-on: xcode-27
    timeout-minutes: 90
    environment: release-ios
    permissions:
      contents: read
    outputs:
      runtime: ${{ steps.updates.outputs.runtime }}
      build: ${{ steps.updates.outputs.build }}
    env:
      CI: "1"
      FASTLANE_SKIP_UPDATE_CHECK: "1"
      FASTLANE_HIDE_CHANGELOG: "1"
      FASTLANE_OPT_OUT_USAGE: "1"
    steps:
      - name: Check out release commit
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Require release credentials
        shell: bash
        env:
          EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
          ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
          ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
          ASC_PRIVATE_KEY: ${{ secrets.ASC_PRIVATE_KEY }}
        run: |
          missing=()
          for name in EXPO_TOKEN ASC_KEY_ID ASC_ISSUER_ID ASC_PRIVATE_KEY; do
            if [[ -z "${!name}" ]]; then missing+=("$name"); fi
          done
          if (( ${#missing[@]} > 0 )); then
            echo "Missing release-ios secrets: ${missing[*]}" >&2
            exit 1
          fi

      - name: Set up Bun and Node
        uses: ./.github/actions/setup-bun
        with:
          install: none

      - name: Select and verify iOS tools
        shell: bash
        run: |
          echo "IPA_PATH=$RUNNER_TEMP/openbot-testflight.ipa" >> "$GITHUB_ENV"
          sudo xcode-select --switch /Applications/Xcode_27.1.app/Contents/Developer
          xcodebuild -version
          pod --version
          fastlane --version

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Check source
        run: |
          bun run lint
          bun run typecheck
          bun run test:desktop -- apps/mobile/src

      # The binary must have this runtime version, and a later over-the-air update of this commit gets
      # the same value in a clean checkout. Compute it before the build: on the Linux runner, the
      # native build changes what a fingerprint of this checkout gives.
      - name: Compute the runtime version of this commit
        id: runtime
        run: bun scripts/mobile-ota.ts runtime-version --platform ios

      - name: Build production iOS on this runner
        working-directory: apps/mobile
        env:
          EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
        run: >-
          bunx eas-cli@24.1.2 build
          --platform ios --profile production --local --non-interactive
          --output "$IPA_PATH"

      - name: Save signed IPA
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: ios-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ env.IPA_PATH }}
          if-no-files-found: error
          retention-days: 7

      # A binary with another update server, channel or certificate gets no over-the-air update, and
      # only the next store build can correct it. So it must not reach TestFlight.
      - name: Check the update settings of the binary
        id: updates
        env:
          RUNTIME: ${{ steps.runtime.outputs.runtime }}
        run: bun scripts/mobile-ota.ts verify-build --platform ios --artifact "$IPA_PATH" --runtime "$RUNTIME"

      - name: Upload to App Store Connect
        working-directory: apps/mobile
        env:
          ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
          ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
          ASC_PRIVATE_KEY: ${{ secrets.ASC_PRIVATE_KEY }}
        run: fastlane ios beta

      - name: Summarize upload
        shell: bash
        run: |
          {
            echo '## iOS upload complete'
            echo "Commit: $GITHUB_SHA"
            echo "Artifact: ios-$GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT"
            echo 'Apple must process the build before it is available in TestFlight.'
            echo 'Manage tester groups in App Store Connect. This workflow does not publish to the App Store.'
          } >> "$GITHUB_STEP_SUMMARY"

  # `bun run mobile:ota:publish` sends an update only to a runtime version that a tag here records.
  record:
    name: Record the store build
    needs: release
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      # The `mobile-build/` tag.
      contents: write
    steps:
      - name: Check out release commit
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Bun
        uses: ./.github/actions/setup-bun
        with:
          install: none

      - name: Tag the commit with the build and its runtime version
        env:
          GH_TOKEN: ${{ github.token }}
          BUILD: ${{ needs.release.outputs.build }}
          RUNTIME: ${{ needs.release.outputs.runtime }}
        run: bun scripts/mobile-ota.ts record-build --platform ios --build "$BUILD" --runtime "$RUNTIME"
