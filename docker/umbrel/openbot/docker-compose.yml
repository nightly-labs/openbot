version: "3.7"

services:
  app_proxy:
    environment:
      APP_HOST: __APP_ID___server_1
      APP_PORT: 8080

  server:
    image: ghcr.io/nightly-labs/openbot:__VERSION__@__DIGEST__
    restart: unless-stopped
    stop_grace_period: 1m
    shm_size: "1gb"
    security_opt:
      - apparmor=${APP_OPENBOT_APPARMOR_PROFILE:-docker-default}
      - seccomp=${APP_DATA_DIR}/seccomp.json
      - no-new-privileges:true
    volumes:
      - ${APP_DATA_DIR}/data:/data
    environment:
      OPENBOT_SETUP_PAGE_PORT: "8080"
