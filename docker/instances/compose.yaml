services:
  openbot:
    image: ghcr.io/nightly-labs/openbot:${OPENBOT_TAG:-latest}
    container_name: openbot-${OPENBOT_NAME:?}
    restart: unless-stopped
    security_opt:
      - seccomp=../seccomp.json
      - no-new-privileges:true
    shm_size: 1g
    stop_grace_period: 60s
    cpus: ${OPENBOT_CPUS:?}
    mem_limit: ${OPENBOT_MEM:?}
    memswap_limit: ${OPENBOT_MEM:?}
    pids_limit: 8192
    ulimits:
      nofile:
        soft: 65536
        hard: 524288
    read_only: true
    tmpfs:
      - /tmp:exec,mode=1777,size=${OPENBOT_TMP:-8g}
      - /var/tmp:exec,mode=1777,size=1g
      - /run/lock:mode=1777,size=1m
      - /run/openbot:mode=0700,uid=1000,gid=1000,size=64m
    volumes:
      - /srv/openbot/${OPENBOT_NAME:?}/data:/data
      - /srv/openbot/${OPENBOT_NAME:?}/update-requests:/var/lib/openbot-update/requests
      - /srv/openbot/${OPENBOT_NAME:?}/update-status:/var/lib/openbot-update/status:ro
    networks:
      - openbot
    logging:
      driver: syslog
      options:
        syslog-address: unixgram:///var/lib/openbot-docker/dev/log
        tag: "{{.Name}}"
        mode: non-blocking
        max-buffer-size: 4m

networks:
  openbot:
    external: true
