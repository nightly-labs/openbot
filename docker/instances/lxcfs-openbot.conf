# `openbot-instance setup` installs this file as /etc/systemd/system/lxcfs.service.d/openbot.conf.
# --enable-cfs makes /proc/cpuinfo and /proc/stat of a container list as many CPUs as its CPU limit,
# not the CPUs of the host. See lxcfs.yaml.
[Service]
ExecStart=
ExecStart=/usr/bin/lxcfs --enable-cfs /var/lib/lxcfs
