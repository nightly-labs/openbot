appId: app.openbot.desktop
productName: OpenBot
protocols:
  - name: OpenBot invitations
    schemes:
      - openbot
asar: true
artifactName: ${productName}-${version}-${arch}.${ext}
electronUpdaterCompatibility: ">=2.16"
electronFuses:
  resetAdHocDarwinSignature: true
  runAsNode: false
  enableCookieEncryption: true
  enableNodeOptionsEnvironmentVariable: false
  enableNodeCliInspectArguments: false
  enableEmbeddedAsarIntegrityValidation: true
  onlyLoadAppFromAsar: true
  loadBrowserProcessSpecificV8Snapshot: false
  grantFileProtocolExtraPrivileges: false
publish:
  provider: github
  owner: nightly-labs
  repo: openbot
files:
  - out/**/*
  - package.json
  - LICENSE
  - NOTICE
  - "!node_modules/@anthropic-ai/claude-agent-sdk-darwin-*/**/*"
  - "!node_modules/@anthropic-ai/claude-agent-sdk-linux-*/**/*"
  - "!node_modules/@anthropic-ai/claude-agent-sdk-win32-*/**/*"
asarUnpack:
  # The database host is loaded by path as a separate process, not required into the main bundle.
  - out/main/agent-database-host.js
extraResources:
  - from: resources/managed-skills
    to: managed-skills
  - from: resources/plugin-catalog
    to: plugin-catalog
  - from: build/icon-production.png
    to: icons/icon-production.png
  - from: build/icon-dev.png
    to: icons/icon-dev.png
  - from: build/icon-preview.png
    to: icons/icon-preview.png
  - from: node_modules/electron/dist/LICENSE
    to: licenses/Electron-LICENSE
  - from: node_modules/electron/dist/LICENSES.chromium.html
    to: licenses/LICENSES.chromium.html
  - from: build/licenses/OpenAI-Whisper-LICENSE
    to: licenses/OpenAI-Whisper-LICENSE
  - from: build/licenses/whisper.cpp-LICENSE
    to: licenses/whisper.cpp-LICENSE
# Voice and remote desktop are prepared for macOS and Windows only, and each Computer Use driver
# is built for one target, so their resources are listed under each platform instead of here.
# electron-builder merges the root and platform lists, so every build still gets its own, while a
# build has no missing `from` to fail on and no other platform's driver to carry.
directories:
  output: dist
mac:
  category: public.app-category.productivity
  minimumSystemVersion: "13.0"
  notarize: true
  hardenedRuntime: true
  icon: build/icon-production.icns
  extraResources:
    - from: build/icon-production-macos-safe-area.png
      to: icons/icon-production-macos-safe-area.png
    - from: build/icon-dev-macos-safe-area.png
      to: icons/icon-dev-macos-safe-area.png
    - from: build/icon-preview-macos-safe-area.png
      to: icons/icon-preview-macos-safe-area.png
    - from: .openbot-build/whisper/bin
      to: whisper/bin
    - from: build/remote-desktop-runtime
      to: remote-desktop-runtime
    - from: build/cua-driver/darwin/arm64
      to: cua-driver/darwin/arm64
  # The Computer Use driver arrives signed by Cua AI with the hardened runtime, a secure timestamp
  # and `com.apple.security.automation.apple-events`. Re-signing it with OpenBot's inherited
  # entitlements would drop that entitlement and break the driver's Automation route, so its own
  # Developer ID signature is kept. Notarization accepts a nested binary signed by another team.
  signIgnore:
    - Contents/Resources/cua-driver/
  entitlements: build/entitlements.mac.plist
  entitlementsInherit: build/entitlements.mac.inherit.plist
  darkModeSupport: true
  extendInfo:
    ElectronTeamID: ZTRDTUL87R
    NSMicrophoneUsageDescription: OpenBot uses the microphone to transcribe voice prompts locally on this Mac.
    # Computer Use runs the driver as a child process, so macOS asks for both grants in OpenBot's
    # name and shows these sentences.
    NSScreenCaptureUsageDescription: OpenBot captures the screen so an agent can see the app windows you ask it to control.
    NSAppleEventsUsageDescription: OpenBot sends Automation events so an agent can control the apps you ask it to control.
    NSUserActivityTypes:
      - NSUserActivityTypeBrowsingWeb
  target:
    - target: dmg
      arch:
        - arm64
    - target: zip
      arch:
        - arm64
win:
  icon: build/icon-production.ico
  extraResources:
    - from: .openbot-build/whisper/bin
      to: whisper/bin
    - from: build/remote-desktop-runtime
      to: remote-desktop-runtime
    - from: build/cua-driver/win32/x64
      to: cua-driver/win32/x64
  target:
    - target: nsis
      arch:
        - x64
linux:
  category: Development
  icon: build/icon-production.png
  synopsis: A local-first multi-agent desktop workspace.
  extraResources:
    - from: build/linux/openbot.apparmor
      to: linux/openbot.apparmor
    - from: build/cua-driver/linux/${arch}
      to: cua-driver/linux/${arch}
  # Electron takes its Linux app id from `desktopName` in package.json, and the window manager
  # matches a running window to the launcher through `StartupWMClass`. Syncing the two from one
  # value is what makes the taskbar icon group with the window it belongs to.
  syncDesktopName: true
  target:
    - target: AppImage
      arch:
        - x64
        - arm64
dmg:
  title: ${productName} ${version}
  background: build/dmg-background.png
  iconSize: 128
  iconTextSize: 14
  window:
    x: 400
    y: 467
    width: 680
    height: 506
  contents:
    - x: 190
      y: 220
    - x: 490
      y: 220
      type: link
      path: /Applications
