# TURN over TLS on port 443 (README "TURN on port 443"). Include this file at the top level of
# /etc/nginx/nginx.conf, outside `http`. It needs the stream module (`libnginx-mod-stream`).
#
# nginx reads only the server name (SNI) of each TLS connection on 443. It does not decrypt the
# connection. A `turn*.openbot.run` name goes to coturn; every other name goes to the HTTPS servers.
# These then listen on 127.0.0.1:8444 with PROXY protocol, so they still see the client address.
# No HTTPS server on this machine can keep a `listen 443`.

stream {
  map $ssl_preread_server_name $openbot_tls_backend {
    ~^turn[a-z0-9-]*\.openbot\.run$ 127.0.0.1:5350;
    default 127.0.0.1:8444;
  }

  server {
    listen 443 reuseport;
    listen [::]:443 reuseport;
    ssl_preread on;
    proxy_protocol on;
    proxy_pass $openbot_tls_backend;
    proxy_connect_timeout 5s;
    # A Signal WebSocket can stay open for a day (`proxy_read_timeout 1d` in the HTTPS server).
    proxy_timeout 1d;
  }

  # coturn reads only the binary PROXY protocol, and nginx sends the text one, so this hop removes
  # it. coturn sees 127.0.0.1 as the client address of these connections. coturn closes the
  # connection when its allocation ends, so the long timeout keeps no dead connection.
  server {
    listen 127.0.0.1:5350 proxy_protocol;
    proxy_pass 127.0.0.1:5349;
    proxy_connect_timeout 5s;
    proxy_timeout 1d;
  }
}
