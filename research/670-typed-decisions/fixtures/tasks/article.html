<style>

  .logo { font-weight: 800; font-size: 20px; color: #0b6bcb; text-decoration: none; }
  nav a { color: #444c56; text-decoration: none; margin-right: 16px; font-size: 15px; }
  .right { margin-left: auto; }
  .right button { background: #0b6bcb; color: #fff; border: 0; border-radius: 6px; padding: 8px 14px; cursor: pointer; }
  article { max-width: 720px; margin: 0 auto; padding: 40px 24px; font-size: 18px; line-height: 1.7; }

</style>
</head>
<body>
<header>
  <div class="bar">
    <a class="logo" href="#">Driftwood</a>
    <nav aria-label="Main">
      <a href="#">Home</a>
      <a href="#">Product</a>
      <a href="#">Docs</a>
      <a href="blog.html">Blog</a>
      <a href="#">Changelog</a>
    </nav>
    <div class="right"><button type="button">Download</button></div>
  </div>
</header>
<article>
  <a href="blog.html">← All articles</a>
  <h1 id="title">Article</h1>
  <div class="meta">By the Driftwood team · 8 min read</div>
  <p id="lead"></p>
  <p>This article is part of our engineering series. We write about what we build, what broke, and what we would do
  differently next time.</p>
  <p><button type="button">Copy link</button> <button type="button">Share</button></p>
</article>
<footer><a href="#">RSS</a><a href="#">About</a><a href="#">Privacy</a><br><br>© 2026 Driftwood Labs</footer>
<script>
  const TITLES = {
    "crdt-text": "What we learned shipping CRDT text editing",
    "cold-start": "Cutting cold start time by 40 percent",
    "offline-images": "Offline images without filling the disk",
    "design-sidebar": "Redesigning the sidebar, again",
    "sync-conflicts": "Explaining sync conflicts to humans",
    "rust-bindings": "Moving our core to Rust bindings",
    "encryption-at-rest": "Encryption at rest on every platform",
    "search-ranking": "Ranking search results you wrote yourself",
    "backup-format": "A backup format that will outlive us",
    "mobile-memory": "Staying under 200 MB on older phones",
    "postgres-sync-server": "Scaling Postgres for our sync relay",
    "accessibility-audit": "What an accessibility audit taught us",
    "sqlite-fts": "Full-text search in SQLite: FTS5 in practice",
    "local-first-auth": "Accounts in a local-first app",
    "release-train": "Our two-week release train",
    "scaling-sync": "Scaling sync to a million devices",
    "first-year": "Driftwood's first year",
  };
  const slug = new URLSearchParams(location.search).get("slug") || "unknown";
  const title = TITLES[slug] || "Article not found";
  document.title = title + " – Driftwood blog";
  document.getElementById("title").textContent = title;
  document.getElementById("lead").textContent = "An engineering note from the Driftwood team.";
  report("open_article", { slug });
</script>
</body>
</html>
