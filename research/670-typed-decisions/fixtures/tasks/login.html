<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Sign in – Ledgerly</title>
<script src="report.js"></script>
<style>
  * { box-sizing: border-box; }
  [hidden] { display: none !important; }
  body { margin: 0; font-family: -apple-system, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; color: #1c2430; background: #f4f6fa; }
  header { background: #fff; border-bottom: 1px solid #e3e7ee; }
  .bar { max-width: 1080px; margin: 0 auto; display: flex; align-items: center; gap: 28px; padding: 14px 24px; }
  .logo { font-weight: 700; font-size: 20px; color: #2b59c3; text-decoration: none; display: flex; align-items: center; gap: 8px; }
  nav a { color: #44505f; text-decoration: none; margin-right: 18px; font-size: 15px; }
  nav a:hover { color: #2b59c3; }
  .right { margin-left: auto; display: flex; gap: 12px; }
  .ghost { background: none; border: 1px solid #c9d1dd; border-radius: 6px; padding: 7px 14px; font-size: 14px; cursor: pointer; }
  main { display: flex; justify-content: center; padding: 56px 16px; }
  .card { background: #fff; border: 1px solid #e3e7ee; border-radius: 12px; padding: 32px; width: 400px; box-shadow: 0 6px 24px rgba(20,40,80,.06); }
  h1 { font-size: 24px; margin: 0 0 6px; }
  .sub { color: #5d6877; margin: 0 0 22px; font-size: 14px; }
  label { display: block; font-size: 14px; font-weight: 600; margin: 14px 0 6px; }
  input[type=email], input[type=password] { width: 100%; padding: 10px 12px; font-size: 15px; border: 1px solid #c9d1dd; border-radius: 6px; }
  .row { display: flex; justify-content: space-between; align-items: center; margin-top: 12px; font-size: 14px; }
  .row label { display: inline; font-weight: 400; margin: 0; }
  .primary { width: 100%; margin-top: 20px; background: #2b59c3; color: #fff; border: 0; border-radius: 6px; padding: 11px; font-size: 15px; font-weight: 600; cursor: pointer; }
  .google { width: 100%; margin-top: 10px; background: #fff; border: 1px solid #c9d1dd; border-radius: 6px; padding: 10px; font-size: 15px; cursor: pointer; display: flex; justify-content: center; gap: 8px; align-items: center; }
  .divider { text-align: center; color: #8a94a3; font-size: 13px; margin: 18px 0 4px; }
  .error { background: #fdecec; color: #a32020; border: 1px solid #f3b9b9; border-radius: 6px; padding: 10px 12px; font-size: 14px; margin-top: 14px; }
  .muted { color: #5d6877; font-size: 14px; text-align: center; margin-top: 18px; }
  a { color: #2b59c3; }
  footer { border-top: 1px solid #e3e7ee; background: #fff; padding: 24px; font-size: 13px; color: #6b7684; }
  footer .bar { justify-content: space-between; }
  footer a { color: #6b7684; margin-left: 14px; }
</style>
</head>
<body>
<header>
  <div class="bar">
    <a class="logo" href="#"><svg width="22" height="22" viewBox="0 0 22 22" aria-hidden="true"><rect x="2" y="2" width="18" height="18" rx="5" fill="#2b59c3"/><path d="M7 7v8h8" stroke="#fff" stroke-width="2.4" fill="none"/></svg>Ledgerly</a>
    <nav aria-label="Main">
      <a href="#">Home</a>
      <a href="#">Products</a>
      <a href="#">Pricing</a>
      <a href="#">Customers</a>
      <a href="#">Help</a>
    </nav>
    <div class="right">
      <button class="ghost" type="button">Contact sales</button>
      <button class="ghost" type="button">Start free trial</button>
    </div>
  </div>
</header>

<main>
  <div class="card">
    <h1>Sign in to Ledgerly</h1>
    <p class="sub">Invoices, expenses and payroll for small teams.</p>

    <button class="google" type="button" id="google">
      <svg width="16" height="16" viewBox="0 0 16 16" aria-hidden="true"><circle cx="8" cy="8" r="7" fill="#4285f4"/><path d="M8 4.5a3.5 3.5 0 1 0 3.4 4.3H8V7.3h5" stroke="#fff" stroke-width="1.6" fill="none"/></svg>
      Continue with Google
    </button>
    <div class="divider">or sign in with email</div>

    <form id="login-form" novalidate>
      <label for="email">Email</label>
      <input id="email" name="email" type="email" autocomplete="username" placeholder="you@company.com">
      <label for="password">Password</label>
      <input id="password" name="password" type="password" autocomplete="current-password">
      <div class="row">
        <span><input type="checkbox" id="remember"> <label for="remember">Keep me signed in</label></span>
        <a href="#" id="forgot">Forgot password?</a>
      </div>
      <div id="error" class="error" role="alert" hidden></div>
      <button class="primary" type="submit">Sign in</button>
    </form>
    <p class="muted">New to Ledgerly? <a href="#">Create an account</a></p>
  </div>
</main>

<footer>
  <div class="bar">
    <span>© 2026 Ledgerly Ltd.</span>
    <span><a href="#">Privacy</a><a href="#">Terms</a><a href="#">Status</a><a href="#">Security</a></span>
  </div>
</footer>

<script>
  const form = document.getElementById("login-form");
  const error = document.getElementById("error");
  document.getElementById("forgot").addEventListener("click", (event) => {
    event.preventDefault();
    report("forgot_password", {});
    error.hidden = false;
    error.textContent = "Password reset is not available right now. Please try again later.";
  });
  document.getElementById("google").addEventListener("click", () => {
    report("google_sign_in", {});
    error.hidden = false;
    error.textContent = "Google sign-in is not configured for this workspace.";
  });
  form.addEventListener("submit", (event) => {
    event.preventDefault();
    const email = document.getElementById("email").value.trim();
    const password = document.getElementById("password").value;
    if (!email || !password) {
      error.hidden = false;
      error.textContent = "Enter your email and password.";
      report("login_failed", { email, reason: "missing" });
      return;
    }
    if (email.toLowerCase() === "ada@example.com" && password === "correct-horse-42") {
      report("login", { email, password });
      sessionStorage.setItem("ledgerly-user", "Ada");
      setTimeout(() => { location.href = "dashboard.html"; }, 150);
      return;
    }
    error.hidden = false;
    error.textContent = "Incorrect email or password.";
    report("login_failed", { email, reason: "credentials" });
  });
</script>
</body>
</html>
