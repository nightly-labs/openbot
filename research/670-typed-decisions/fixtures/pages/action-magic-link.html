<!doctype html><html lang="en"><head><title>Sign in – Notes</title></head><body>
<main><h1>Sign in to Notes</h1><p>We will email you a sign-in link.</p><label>Email <input type="email" name="email"></label><button type="button" id="go">Email me a link</button><p role="status" id="status"></p></main>
<script>
  const mode = new URLSearchParams(location.search).get("mode");
  document.querySelector("#go").onclick = () => {
    const status = document.querySelector("#status");
    if (mode === "unknown") status.textContent = "We could not find an account with that email address.";
    else status.textContent = "Check your inbox. We sent a sign-in link to " + document.querySelector("[name=email]").value + ".";
  };
</script>
<script src="site.js"></script></body></html>
