<!doctype html><html lang="en"><head><title>Notification settings</title></head><body>
<main><h1>Notifications</h1><label><input type="checkbox" id="weekly"> Weekly summary email</label><button type="button" id="save">Save</button><p role="status" id="status"></p></main>
<script>
  const mode = new URLSearchParams(location.search).get("mode");
  document.querySelector("#save").onclick = () => {
    const status = document.querySelector("#status");
    if (mode === "broken") { document.querySelector("#weekly").checked = false; status.textContent = "Could not save your settings. Your changes were not applied."; }
    else status.textContent = "Settings saved.";
  };
</script>
<script src="site.js"></script></body></html>
